<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inblox</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#101014"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Inblox">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: фиксированная сцена 16:9, интерфейс поверх 3D-канваса. Чёрно-белая палитра логотипа + один синий акцент. */
:root{
  --bg:#0a0a0c; --panel:rgba(16,16,20,.88); --panel2:#1a1a20; --line:rgba(255,255,255,.1);
  --fg:#f4f4f6; --muted:#8d8d99; --accent:#59a8ff; --danger:#ff5a4d; --ok:#35e0a1;
  --display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);display:grid;place-items:center;overflow:hidden}
#stage{position:relative;width:min(100vw,calc(100dvh*16/9));height:min(100dvh,calc(100vw*9/16));background:#000;overflow:hidden;container-type:size;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;visibility:hidden}
#ui{position:absolute;inset:0;font-size:clamp(11px,1.1cqw,22px);pointer-events:none;line-height:1.35}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.screen>*{pointer-events:auto}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:.5em 1em;border-radius:99em;font-weight:500;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:rgba(255,255,255,.32)}
.btn:focus-visible,.card:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:#fff;color:#0a0a0c;border-color:#fff}
.btn.pri:hover{background:#e6e6ea}
.btn.danger{color:var(--danger)}
.btn.sm{padding:.3em .75em;font-size:.9em}
.btn.ico{padding:.5em .8em}
.btn[disabled]{opacity:.35;pointer-events:none}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}
.logo{display:inline-flex;align-items:center;gap:.55em;font-family:var(--display);font-weight:700;font-size:1.25em;letter-spacing:-.02em;color:var(--fg);background:none;border:0;cursor:pointer;padding:0}
.logo svg{width:1.9em;height:1.9em;display:block}
.logo .in{fill:var(--bg)}
.topbar{position:absolute;left:0;right:0;top:0;height:3.6em;display:flex;align-items:center;gap:.7em;padding:0 1.2em;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.sp{flex:1}
input[type=text],input[type=password],input[type=number],select{background:#101014;border:1px solid var(--line);border-radius:.45em;padding:.38em .55em;min-width:0;width:100%}
input[type=text].name{width:16em;font-family:var(--display);font-weight:600;font-size:1.05em;background:transparent;border-color:transparent}
input[type=text].name:hover,input[type=text].name:focus{border-color:var(--line);background:#101014}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 1em) 55%,calc(100% - .7em) 55%;background-size:.3em .3em;background-repeat:no-repeat;padding-right:1.6em}
input[type=color]{width:100%;height:2em;padding:0;border:1px solid var(--line);border-radius:.45em;background:#101014;cursor:pointer}
input[type=range]{width:100%;accent-color:#fff}
input[type=checkbox]{accent-color:#fff;width:1.1em;height:1.1em}
.lbl{display:block;font-size:.78em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .35em}
.row{display:flex;gap:.5em;align-items:center}
.row>*{flex:1}
.field{margin-bottom:.9em}
.sec{padding:.9em 1em;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}

/* Главное меню */
#home{background:transparent}
#home .head{position:absolute;left:0;right:0;top:0;height:4.4em;display:flex;align-items:center;gap:.8em;padding:0 2.2em}
#home .scroll{position:absolute;left:0;right:0;top:4.4em;bottom:0;overflow:auto;padding:0;-webkit-overflow-scrolling:touch}
#home .hero{height:14em;padding:1.4em 2.2em 0;max-width:32em;text-shadow:0 2px 12px #000}
#home .hero h2{font-size:2.9em;line-height:1.04;margin:0 0 .3em}
.socials{display:flex;align-items:center;gap:.8em;margin-top:2em;padding-top:1.2em;border-top:1px solid var(--line)}
.socials .tg{display:inline-flex;align-items:center;gap:.5em;padding:.45em .95em;border-radius:99em;background:#229ed9;color:#fff;text-decoration:none;font-weight:600;font-size:.95em}
.socials .tg:hover{filter:brightness(1.1)}
.socials .tg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#home .shelf{background:var(--bg);border-top:1px solid var(--line);padding:1.4em 2.2em 2.2em;min-height:calc(100% - 14em)}
#home h2{font-size:1.9em;margin:.2em 0 .1em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1em;margin-top:1.2em}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:.9em;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .thumb{aspect-ratio:16/9;position:relative;display:block;width:100%}
.card .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.card .meta{padding:.8em .9em .5em}
.card .meta b{display:block;font-family:var(--display);font-weight:600;font-size:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{font-size:.85em;color:var(--muted)}
.frow{display:flex;align-items:center;gap:.6em;padding:.5em 0;border-bottom:1px solid var(--line)}
.frow .auth{display:flex;align-items:center;gap:.6em;background:none;border:0;color:var(--fg);cursor:pointer;text-align:left}
.card .meta input.rn{font-family:var(--display);font-weight:600;font-size:1em;padding:.1em .35em}
.card .acts{display:flex;gap:.4em;padding:.4em .9em .9em;margin-top:auto}
.card.new{align-items:center;justify-content:center;border-style:dashed;background:transparent;cursor:pointer;min-height:14em;color:var(--muted);gap:.5em;font-size:1em}
.card.new:hover{color:var(--fg);border-color:rgba(255,255,255,.35)}
.card.new .plus{font-size:2.6em;line-height:1;font-weight:300}

/* Аватар */
.apanel{position:absolute;right:0;top:3.6em;bottom:0;width:26em;background:var(--panel);border-left:1px solid var(--line);overflow:auto;backdrop-filter:blur(8px)}
.sws{display:flex;flex-wrap:wrap;gap:.4em}
.sw{width:1.9em;height:1.9em;border-radius:.45em;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.chips{display:flex;flex-wrap:wrap;gap:.4em}
.chip{border:1px solid var(--line);background:#101014;border-radius:99em;padding:.35em .85em;cursor:pointer;font-size:.95em}
.chip.on{background:#fff;color:#0a0a0c;border-color:#fff}
.ahint{position:absolute;left:1.4em;bottom:1.2em;color:var(--muted);font-size:.9em;pointer-events:none}

/* Редактор */
.tools{position:absolute;left:.8em;top:4.4em;width:10.5em;background:var(--panel);border:1px solid var(--line);border-radius:.8em;padding:.4em;backdrop-filter:blur(8px)}
.tool{display:flex;align-items:center;gap:.6em;width:100%;text-align:left;background:none;border:0;border-radius:.5em;padding:.42em .5em;cursor:pointer}
.tool:hover{background:rgba(255,255,255,.08)}
.tool i{width:1em;height:1em;border-radius:.25em;border:1px solid rgba(255,255,255,.25);flex:none}
.tool i.cyl,.tool i.sphere{border-radius:50%}
.tool i.cone,.tool i.pyramid{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.tool i.wedge{clip-path:polygon(0 100%,100% 100%,100% 0);border-radius:0}
.tool i.stairs{clip-path:polygon(0 100%,0 75%,25% 75%,25% 50%,50% 50%,50% 25%,75% 25%,75% 0,100% 0,100% 100%);border-radius:0}
.rpanel{position:absolute;right:.8em;top:4.4em;max-height:calc(100% - 5.2em);width:19em;background:var(--panel);border:1px solid var(--line);border-radius:.8em;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(8px)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:.8em .2em;color:var(--muted);cursor:pointer;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-bottom-color:#fff}
#edBody{overflow:auto;flex:1;min-height:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.45em}
.g3 label span{display:block;font-size:.75em;color:var(--muted);margin-bottom:.15em}
.swr{display:flex;gap:.3em;flex-wrap:wrap;margin-top:.45em}
.swr .sw{width:1.5em;height:1.5em}
.hint{position:absolute;left:12.2em;bottom:.8em;max-width:56em;color:rgba(255,255,255,.55);font-size:.85em;pointer-events:none;text-shadow:0 1px 3px #000}
.stat{position:absolute;left:12.2em;top:4.4em;color:rgba(255,255,255,.7);font-size:.85em;pointer-events:none;text-shadow:0 1px 3px #000}
.srow{display:flex;align-items:center;gap:.5em;padding:.35em 0}
.srow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow select{flex:1.3}
.drop{border:1px dashed rgba(255,255,255,.25);border-radius:.6em;padding:1em;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:.7em}
.drop:hover{border-color:#fff;color:var(--fg)}

/* Игра */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:.7em;padding:1em 1.2em;pointer-events:none!important}
.hud>*{pointer-events:auto}
.pill{background:rgba(10,10,12,.6);border:1px solid var(--line);border-radius:99em;padding:.4em .95em;backdrop-filter:blur(6px);font-variant-numeric:tabular-nums;font-weight:500;pointer-events:none}
.pill b{font-family:var(--display)}
.npcp{position:absolute;left:50%;bottom:6.5em;transform:translateX(-50%);background:rgba(10,10,14,.78);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:2em;padding:.55em 1.1em;font:inherit;cursor:pointer;pointer-events:auto!important;z-index:3}
.npcb{position:absolute;left:50%;bottom:2.2em;transform:translateX(-50%);width:min(92%,38em);background:rgba(10,10,14,.88);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:1em;padding:.8em 1.1em;pointer-events:auto!important;cursor:pointer;z-index:4;text-align:left}
.npcb b{display:block;color:#ffd23d;margin-bottom:.25em}.npcb p{margin:0 0 .5em;line-height:1.4;font-size:1.05em;word-break:break-word}.npcb .nx{display:block;text-align:right;font-size:.8em;color:rgba(255,255,255,.6)}
.npcp[hidden],.npcb[hidden]{display:none}
.hintp{position:absolute;left:0;right:0;bottom:1em;text-align:center;color:rgba(255,255,255,.6);font-size:.85em;pointer-events:none!important;text-shadow:0 1px 3px #000}
.ov{position:absolute;inset:0;background:rgba(5,5,8,.62);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.ov .box{background:var(--panel2);border:1px solid var(--line);border-radius:1em;padding:1.6em 2em;min-width:22em;text-align:center}
.ov h2{font-size:2em;margin-bottom:.3em}
.ov .btns{display:flex;flex-direction:column;gap:.5em;margin-top:1.2em}
.modal-ta{width:100%;height:12em;background:#101014;border:1px solid var(--line);border-radius:.5em;color:var(--fg);font:12px/1.4 ui-monospace,monospace;padding:.6em;resize:none}
#toast{position:absolute;left:50%;bottom:2.2em;transform:translateX(-50%);background:#fff;color:#0a0a0c;border-radius:99em;padding:.5em 1.2em;font-weight:500;font-size:1em;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:80%;text-align:center}
#toast.on{opacity:1}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:2em;background:#000;z-index:60}
.fitb{font-weight:600;letter-spacing:.02em}
label.drop{position:relative;display:block;overflow:hidden}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
.card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.covp{aspect-ratio:16/9;border-radius:.5em;border:1px solid var(--line);background:#101014 center/cover no-repeat;margin-bottom:.6em;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85em}
.pclose{flex:none!important;background:none;border:0;color:var(--muted);padding:0 .9em;cursor:pointer;font-size:1.1em;border-radius:.4em}
.pclose:hover{color:var(--fg);background:rgba(255,255,255,.08)}
.popen{position:absolute;top:4.4em;z-index:2}
.popen.l{left:.8em}.popen.r{right:.8em}
.tools{max-height:calc(100% - 5.2em);overflow:auto}
/* Сенсорное управление */
.touch,.thint{display:none}
.istouch .touch{display:block}
.istouch .hintp,.istouch .hint{display:none}
.istouch .thint{display:block;position:absolute;left:12.2em;bottom:.8em;color:rgba(255,255,255,.55);font-size:.85em;pointer-events:none;text-shadow:0 1px 3px #000}
.touch{position:absolute;inset:0;pointer-events:none!important}
.joy{position:absolute;left:3em;bottom:3em;width:10em;height:10em;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);touch-action:none;pointer-events:auto!important}
.joy i{position:absolute;left:50%;top:50%;width:4.2em;height:4.2em;margin:-2.1em 0 0 -2.1em;border-radius:50%;background:rgba(255,255,255,.38);pointer-events:none}
.jbtn{position:absolute;right:3em;bottom:3.5em;width:7.5em;height:7.5em;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;font-weight:600;touch-action:none;pointer-events:auto!important;-webkit-tap-highlight-color:transparent}
.jbtn:active{background:rgba(255,255,255,.4)}
.istouch .btn{padding:.62em 1.1em}
.istouch .btn.sm{padding:.5em .9em}
.istouch .tool{padding:.5em .5em}

/* Python и полёт */
.code{width:100%;min-height:15em;background:#0c0d11;border:1px solid var(--line);border-radius:.5em;color:#e8e8ee;padding:.6em .7em;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;line-height:1.45;resize:vertical;tab-size:4;white-space:pre;overflow:auto}
.pystat{font-size:.85em;margin:.5em 0;min-height:1.3em;word-break:break-word}
.pystat.err{color:var(--danger)}
.pystat.ok{color:var(--ok)}
.pyh{margin:0;padding-left:1.2em;font-size:.88em;line-height:1.5}
.pyh code,.sec details code{background:#101014;padding:0 .3em;border-radius:.3em;font-size:.95em}
.flybar{position:absolute;left:50%;top:4.4em;transform:translateX(-50%);display:flex;gap:.35em;flex-wrap:wrap;justify-content:center;max-width:46em;background:var(--panel);border:1px solid var(--line);border-radius:.8em;padding:.4em .5em;backdrop-filter:blur(8px);z-index:6}
.flybar .btn{padding:.3em .6em}
.btn.on{background:#fff;color:#000}
.guil{position:absolute;inset:0;overflow:hidden;pointer-events:none!important;z-index:0}
.gui-el{position:absolute;box-sizing:border-box;display:flex;align-items:center;padding:.1em .4em;line-height:1.2;overflow:hidden;pointer-events:none;user-select:none;-webkit-user-select:none;font-family:var(--body)}
.gui-el .gt{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.gui-el.text .gt{text-shadow:0 1px 4px #000}
.gui-el.button{pointer-events:auto;cursor:pointer;font-weight:600;transition:filter .1s,transform .1s}
.gui-el.button:hover{filter:brightness(1.12)}
.gui-el.button:active{transform:scale(.97)}
.guil.edit .gui-el{pointer-events:auto;cursor:move;outline:1px dashed rgba(255,255,255,.4);touch-action:none;overflow:visible}
.guil.edit .gui-el.sel{outline:2px solid #59a8ff}
.guil.edit .gui-el.off{opacity:.4}
.gui-rh{position:absolute;right:-.4em;bottom:-.4em;width:.9em;height:.9em;background:#59a8ff;border-radius:.2em;cursor:nwse-resize;touch-action:none;z-index:1}
.istouch .gui-rh{width:1.9em;height:1.9em;right:-.95em;bottom:-.95em;border-radius:.45em}
.istouch .guil.edit .gui-el::after{content:'';position:absolute;inset:-.7em}
.rpanel.gdrag{opacity:.15;pointer-events:none;transition:opacity .1s}
.imgs .sw{width:2.7em;height:2.7em;background-size:cover!important;background-position:center!important}
.imgadd{position:relative;display:inline-flex;align-items:center;justify-content:center;border:2px dashed rgba(255,255,255,.35)!important;background:transparent;color:var(--muted);cursor:pointer;overflow:hidden;font-size:1.1em}
.pban{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:2.6em;font-weight:700;text-shadow:0 2px 8px #000;pointer-events:none!important;opacity:0;transition:opacity .4s}
.pban.on{opacity:1}
.phud{position:absolute;left:50%;top:3.6em;transform:translateX(-50%);background:rgba(10,10,12,.6);border-radius:99em;padding:.25em .9em;font-weight:600;pointer-events:none!important}
.phud:empty{display:none}
.cmsg.err{color:#ff8a80}
/* Сообщество и чат */
.avc{width:2.2em;height:2.2em;border-radius:50%;object-fit:cover;background:#1b1d29;border:2px solid var(--line);flex:none;vertical-align:middle}
.avc.s{width:1.5em;height:1.5em;border-width:1px}
.avc.l{width:6.5em;height:6.5em;border-width:3px}
.adm{color:#35e0a1;font-weight:700;margin-left:.4em;font-size:.8em}
.auth{display:inline-flex;align-items:center;gap:.55em;cursor:pointer;background:none;border:0;color:inherit;padding:0;font:inherit;text-align:left}
.auth:hover b{text-decoration:underline}
.au{display:inline-flex;align-items:center;gap:.35em}
.bio{white-space:pre-wrap;word-break:break-word;color:#dcdce2;line-height:1.45;margin:.8em 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:.8em;margin-top:.8em}
.acts{flex-wrap:wrap}
.sechead{display:flex;align-items:center;gap:.6em;margin-top:2.2em}
.sechead h3{font-size:1.4em;margin:0}
.card .meta span.st{display:flex;gap:.7em;flex-wrap:wrap}
.gpg{background:var(--panel2);border:1px solid var(--line);border-radius:1em;width:min(46em,92%);max-height:92%;overflow:auto;text-align:left}
.gpg .gth{aspect-ratio:16/9;position:relative;width:100%}
.gpg .gth svg{position:absolute;inset:0;width:100%;height:100%}
.gpg .gth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gpg .gb{padding:1.1em 1.5em 1.4em}
.gpg h2{font-size:1.8em;margin:0 0 .15em}
.gpg .desc{white-space:pre-wrap;word-break:break-word;margin:.9em 0;color:#dcdce2;line-height:1.45}
.gpg .row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.btn.like.on{background:#ff4d6d;border-color:#ff4d6d;color:#fff}
.gta{width:100%;height:7em;background:#101014;border:1px solid var(--line);border-radius:.5em;color:var(--fg);padding:.6em;resize:none;font:inherit}
.chat{position:absolute;left:1em;bottom:3em;width:24em;max-width:46%;display:flex;flex-direction:column;gap:.35em;z-index:5;pointer-events:none!important}
.clog{display:flex;flex-direction:column;gap:.15em;max-height:12em;overflow:hidden;justify-content:flex-end}
.cmsg{align-self:flex-start;max-width:100%;background:rgba(10,10,12,.55);border-radius:.5em;padding:.2em .6em;font-size:.9em;line-height:1.3;word-break:break-word;transition:opacity .6s}
.cmsg b{color:var(--accent)}
.cmsg.me b{color:var(--ok)}
.cmsg.sys{color:var(--muted);font-style:italic}
.chat:not(.typing) .cmsg.old{opacity:0}
.cin{display:none;pointer-events:auto!important}
.chat.typing .cin{display:block}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
function showErr(m){ try{ let e=document.getElementById('errbox'); if(!e){ e=document.createElement('div'); e.id='errbox'; e.style.cssText='position:absolute;left:8px;right:8px;top:8px;z-index:99;background:#b3261e;color:#fff;font:12px/1.4 system-ui,sans-serif;padding:8px 12px;border-radius:8px;pointer-events:auto;user-select:text;-webkit-user-select:text'; document.getElementById('stage').appendChild(e); e.onclick=()=>e.remove(); } e.textContent='Ошибка: '+m+' (нажмите, чтобы скрыть)'; }catch(x){} }
window.addEventListener('error',ev=>showErr((ev.message||'ошибка')+(ev.lineno?' [стр. '+ev.lineno+']':'')));
window.addEventListener('unhandledrejection',ev=>showErr(String(ev.reason&&ev.reason.message||ev.reason)));
if(typeof THREE==='undefined'){ showErr('не загрузилась 3D-библиотека three.js. Проверьте интернет или блокировщики и обновите страницу.'); throw new Error('THREE missing'); }
/* ============================================================
   Inblox v0.1 — движок, редактор, аватар, звуки
   ============================================================ */
const DEG=Math.PI/180;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const stage=$('#stage'), canvas=$('#gl');

/* ---------- хранилище (localStorage с запасом в памяти) ---------- */
const store={mem:{},
  get(k,d){ if(k in this.mem) return this.mem[k]; try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v)); delete this.mem[k]; return true;}catch(e){ this.mem[k]=v; return false; } }
};
function toast(msg,ms=2200){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),ms); }

/* ---------- большие файлы (звуки) — IndexedDB, картинки — сжатие ---------- */
const Media={p:null,
  open(){ if(this.p) return this.p; return this.p=new Promise(res=>{ try{ const r=indexedDB.open('inblox',1); r.onupgradeneeded=()=>r.result.createObjectStore('m'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async put(k,v){ const d=await this.open(); if(!d) return false; return new Promise(res=>{ try{ const t=d.transaction('m','readwrite'); t.objectStore('m').put(v,k); t.oncomplete=()=>res(true); t.onerror=t.onabort=()=>res(false); }catch(e){ res(false); } }); },
  async get(k){ const d=await this.open(); if(!d) return null; return new Promise(res=>{ try{ const r=d.transaction('m').objectStore('m').get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async del(k){ const d=await this.open(); if(!d) return; try{ d.transaction('m','readwrite').objectStore('m').delete(k); }catch(e){} }
};
function readDataURL(f){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(f); }); }
async function imgData(f,w,h,q=.85){
  const url=await readDataURL(f); if(!url) throw new Error('read');
  const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('decode')); i.src=url; });
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  const k=Math.max(w/im.width,h/im.height), dw=im.width*k, dh=im.height*k; g.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
  return c.toDataURL('image/jpeg',q);
}

/* ---------- данные ---------- */
/* ===== NPC: персонаж в игре. Данные лежат в part.npc: имя, реплики, внешность (look) ===== */
const NPC_H=3.4, NPC_W=1.2, NPC_MAX=30;
function npcDefault(){ return {name:'Житель',say:'Привет! Рад тебя видеть.\nЗаходи ещё!',turn:true,solid:true,look:{skin:'#f1c27d',shirt:'#ff8fb8',pants:'#2b2f3a',hat:'none',hatColor:'#ff5a4d',face:'smile',emblem:'none',head:'cube',build:'normal',hair:'short',hairColor:'#5a3a22',outfit:'none',outfitColor:'#e8433f'}}; }
function npcLook(n){
  const l=(n&&n.look)||{}, o=Object.assign({},npcDefault().look);
  for(const k of ['skin','shirt','pants','hatColor','hairColor','outfitColor']) if(typeof l[k]==='string'&&/^#[0-9a-fA-F]{3,8}$/.test(l[k])) o[k]=l[k];
  for(const k of ['hat','face','head','build','hair','outfit','emblem']) if(typeof l[k]==='string'&&/^[\w\-]{1,20}$/.test(l[k])) o[k]=l[k];
  for(const k of ['shirtTex','pantsTex']) if(typeof l[k]==='string'&&/^p:[a-z]{1,12}$/.test(l[k])) o[k]=l[k];
  return o;
}
const npcText=n=>String(n&&n.say!=null?n.say:'').replace(/[\u0000-\u0009\u000b-\u001f]/g,'').slice(0,600).split('\n').map(t=>t.trim().slice(0,200)).filter(Boolean).slice(0,12);
const npcName=n=>String(n&&n.name!=null?n.name:'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,24);
const DEF_AVATAR={name:'Игрок',skin:'#f1c27d',shirt:'#59a8ff',pants:'#2b2f3a',hat:'cap',hatColor:'#ff5a4d',face:'smile',emblem:'logo',head:'cube',build:'normal',hair:'none',hairColor:'#2b2118',outfit:'none',outfitColor:'#e8433f'};
const DEF_SET={sky:'day',baseplate:true,baseColor:'#79c267',speed:1,jump:1,gravity:1,winOnCoins:false};
const DEF_SND={jump:'b:jump',coin:'b:coin',win:'b:win',bounce:'b:bounce',checkpoint:'b:checkpoint',music:'b:music1'};
const S={games:[],avatar:Object.assign({},DEF_AVATAR),sounds:[]};
/* Аккаунты хранятся в браузере (localStorage): после обновления страницы вход сохраняется */
/* ---------- Сервер (Cloudflare _worker.js + D1) ---------- */
let installEv=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEv=e; if(typeof Home!=='undefined'&&Home.on) Home.render(); });
addEventListener('appinstalled',()=>{ installEv=null; if(typeof Home!=='undefined'&&Home.on) Home.render(); });
if('serviceWorker' in navigator&&location.protocol==='https:') addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
const banUntil=u=>u?(u<4e12?' (до '+new Date(u).toLocaleString('ru-RU')+')':' (навсегда)'):'';
const Api={tok:store.get('inblox.token',null),
  async call(method,path,body){
    let r,d=null;
    try{ r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',...(this.tok?{Authorization:'Bearer '+this.tok}:{})},body:body===undefined?undefined:JSON.stringify(body)}); }
    catch(e){ return {ok:false,net:true,status:0,d:{},error:'Нет связи с сервером'}; }
    try{ d=await r.json(); }catch(e){ d={}; }
    d=d||{};
    if(d.banned&&Acc.cur) Acc.kick('Аккаунт заблокирован'+(d.reason?': '+d.reason:'')+banUntil(d.until));
    else if(r.status===401&&this.tok&&Acc.cur&&path!=='login') Acc.kick('Сессия закончилась. Войдите снова');
    return {ok:r.ok,status:r.status,d,error:d.error||(r.ok?'':'Сервер недоступен ('+r.status+')')};
  }
};
const Acc={cur:null,list:[],persist:true,
  key(n){ return 'inblox.'+n+'.'+this.cur.id; },
  enter(d){
    this.cur=d.user; if(d.token){ Api.tok=d.token; store.set('inblox.token',d.token); }
    S.games=Array.isArray(d.games)?d.games:[]; Sync.reset();
    S.sounds=store.get(this.key('sounds'),[]).map(x=>x.idb?{id:x.id,name:x.name,stored:true}:x); if(S.sounds.some(x=>x.data&&!x.stored)) setTimeout(()=>saveSounds(),0);
    S.avatar=Object.assign({},DEF_AVATAR,d.avatar||{},{name:d.user.name}); if(d.user.role!=='admin'){ delete S.avatar.vipSuit; delete S.avatar.vipShades; } Snd.cache={}; Cloud.set('Онлайн');
    this.migrate(); SndSync.init();
  },
  /* перенос игр и звуков из старого локального аккаунта с тем же именем (если они были в этом браузере) */
  async migrate(){
    try{
      const olds=store.get('inblox.accounts',[]), me=this.cur; if(!olds.length||store.get('inblox.migrated.'+me.id,false)) return;
      store.set('inblox.migrated.'+me.id,true);
      const o=olds.find(a=>a&&a.name&&a.name.toLowerCase()===me.name.toLowerCase()); if(!o) return;
      let add=0; for(const g of store.get('inblox.games.'+o.id,[])) if(g&&g.id&&!S.games.find(x=>x.id===g.id)){ S.games.push(g); add++; }
      const ls=store.get('inblox.sounds.'+o.id,[]); let sn=0;
      for(const x of ls){ if(!x||S.sounds.find(q=>q.id===x.id)) continue; if(x.idb){ const d=await Media.get(o.id+':s:'+x.id); if(d) await Media.put(me.id+':s:'+x.id,d); S.sounds.push({id:x.id,name:x.name,stored:true}); } else S.sounds.push(x); sn++; }
      if(add||sn){ if(add) saveGames(); if(sn) saveSounds(); if(Home.on) Home.render(); toast('Перенесено с этого устройства: игр '+add,3500); }
    }catch(e){ console.error(e); }
  },
  async register(name,pw){ const r=await Api.call('POST','register',{name,pw}); if(!r.ok||!r.d.user) return r.error||'Сервер недоступен'; this.enter(r.d); return null; },
  async login(name,pw){ const r=await Api.call('POST','login',{name,pw}); if(!r.ok||!r.d.user) return r.d.banned?'Аккаунт заблокирован'+(r.d.reason?': '+r.d.reason:'')+banUntil(r.d.until):(r.error||'Сервер недоступен'); this.enter(r.d); return null; },
  out(){ Snd.stopMusic(); this.cur=null; Api.tok=null; store.set('inblox.token',null); S.games=[]; S.sounds=[]; S.avatar=Object.assign({},DEF_AVATAR); Sync.reset(); Home.pub=[]; },
  logout(){ Api.call('POST','logout'); this.out(); Auth.show('login'); },
  kick(msg){ if(!this.cur) return; if(Play.on) Play.teardown(); this.out(); Auth.show('login'); Auth.err=msg; const e=$('#aErr'); if(e) e.textContent=msg; }
};
/* Синхронизация игр и аватара с сервером (с задержкой, только изменённое) */
const Sync={sent:{},timer:null,avT:null,busy:false,
  reset(){ this.sent={}; for(const g of S.games) this.sent[g.id]=JSON.stringify(g); clearTimeout(this.timer); clearTimeout(this.avT); },
  games(ms=900){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),ms); },
  async flush(){
    if(!Acc.cur) return; if(this.busy){ this.games(); return; } this.busy=true;
    try{
      const cur=new Set(S.games.map(g=>g.id));
      for(const g of S.games){ const j=JSON.stringify(g); if(this.sent[g.id]===j) continue;
        const r=await Api.call('PUT','games/'+encodeURIComponent(g.id),{game:g});
        if(r.ok||(!r.net&&r.status!==401&&r.status!==403)){ this.sent[g.id]=j; if(!r.ok) toast('Не сохранено на сервере: '+r.error,4500); }
        else if(r.net){ toast('Нет связи с сервером: игра сохранится позже',3000); this.games(6000); break; }
        else break; }
      for(const id of Object.keys(this.sent)) if(!cur.has(id)){ const r=await Api.call('DELETE','games/'+encodeURIComponent(id)); if(r.ok) delete this.sent[id]; else if(r.net){ this.games(6000); break; } }
    } finally{ this.busy=false; }
  },
  avatar(){ clearTimeout(this.avT); this.avT=setTimeout(()=>{ if(Acc.cur) Api.call('PUT','avatar',{avatar:{...S.avatar}}); },700); }
};
const saveGames=()=>{ if(!Acc.cur) return; Sync.games(); };
const saveAvatar=()=>{ if(!Acc.cur) return; S.avatar.ts=Date.now(); Sync.avatar(); };
const saveSounds=async()=>{
  if(!Acc.cur) return; const aid=Acc.cur.id;
  for(const x of S.sounds) if(!x.tmp&&x.data&&!x.stored) x.stored=await Media.put(aid+':s:'+x.id,x.data);
  if(!Acc.cur||Acc.cur.id!==aid) return;
  if(!store.set(Acc.key('sounds'),S.sounds.filter(x=>!x.tmp&&(x.stored||x.data)).map(x=>x.stored?{id:x.id,name:x.name,idb:1}:{id:x.id,name:x.name,data:x.data}))) toast('Нет места в браузере: звуки доступны только до закрытия страницы',4000);
  SndSync.push();
};

/* Звуки хранятся на сервере (D1, кусками): доступны с любого устройства. В браузере остаётся кэш. */
async function sndData(x){
  if(x.data) return x.data; const uid=Acc.cur&&Acc.cur.id;
  if(uid){ const d=await Media.get(uid+':s:'+x.id); if(d) return x.data=d; }
  if(x.remote){
    const r=await Api.call('GET','sounds/'+encodeURIComponent(x.id));
    if(r.ok&&r.d.data){ x.data=r.d.data; if(uid&&await Media.put(uid+':s:'+x.id,x.data)){ x.stored=true; } return x.data; }
  }
  return null;
}
const SndSync={up:new Set(),busy:false,again:false,CH:700000,
  okKey(){ return Acc.cur?Acc.key('sndok'):null; },
  okGet(){ const k=this.okKey(); return new Set(k?store.get(k,[]):[]); },
  okSet(s){ const k=this.okKey(); if(k) store.set(k,[...s]); },
  async init(){ this.up=new Set(); await this.list(); this.push(); },
  async list(){
    const aid=Acc.cur&&Acc.cur.id; if(!aid) return; const r=await Api.call('GET','sounds'); if(!r.ok||!Acc.cur||Acc.cur.id!==aid) return;
    const items=r.d.items||[], ids=new Set(items.map(s=>s.id)), ok=this.okGet(); let ch=false;
    for(const s of items){ const x=S.sounds.find(q=>q.id===s.id); if(x) x.remote=true; else S.sounds.push({id:s.id,name:s.name,remote:true}); ok.add(s.id); }
    /* звук, который уже был на сервере, но пропал оттуда, удалён с другого устройства — убираем и здесь */
    for(const x of S.sounds.slice()) if(!x.tmp&&!ids.has(x.id)&&ok.has(x.id)){ S.sounds=S.sounds.filter(q=>q!==x); delete Snd.cache[x.id]; Media.del(aid+':s:'+x.id); ok.delete(x.id); ch=true; }
    this.okSet(ok); if(ch) saveSounds();
  },
  async send(id,name,data){
    const total=Math.max(1,Math.ceil(data.length/this.CH));
    for(let i=0;i<total;i++){
      const r=await Api.call('PUT','sounds/'+encodeURIComponent(id)+'/'+i,{name,total,data:data.slice(i*this.CH,(i+1)*this.CH)});
      if(!r.ok) return r;
    }
    return {ok:true};
  },
  async push(){
    if(!Acc.cur) return; if(this.busy){ this.again=true; return; } this.busy=true; const aid=Acc.cur.id;
    try{
      for(const x of S.sounds.slice()){
        if(!Acc.cur||Acc.cur.id!==aid) break; if(x.tmp||x.remote||this.up.has(x.id)) continue;
        const d=await sndData(x); if(!d) continue; this.up.add(x.id);
        const r=await this.send(x.id,x.name,d);
        if(r.ok){ x.remote=true; const ok=this.okGet(); ok.add(x.id); this.okSet(ok); }
        else if(r.net){ this.up.delete(x.id); setTimeout(()=>this.push(),15000); break; }
        else toast('Звук «'+x.name+'» не сохранён на сервере: '+r.error,4500);
      }
    } finally{ this.busy=false; if(this.again){ this.again=false; setTimeout(()=>this.push(),50); } }
  },
  remove(id){ this.up.delete(id); const ok=this.okGet(); ok.delete(id); this.okSet(ok); if(Acc.cur) Api.call('DELETE','sounds/'+encodeURIComponent(id)); }
};

/* ---------- Облако: личное хранилище артефакта (db), привязано к вашему входу в claude.ai ---------- */
const Cloud={db:null,uid:null,ok:false,ro:false,txt:'',docs:new Map(),sent:{},accDirty:false,avDirty:false,q:Promise.resolve(),timer:null,
  set(t){ this.txt=t; $$('.cloudst').forEach(e=>e.textContent=t); },
  async init(){ return;
    this.set('Облако: подключение…');
    try{
      const c=window.claude; if(!c||!c.use){ this.set('Облако: нет'); return; }
      const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
      const uid=user&&await user.id();
      if(!db||!uid){ this.set('Облако: нет'); return; }
      this.db=db; this.uid=uid;
      try{ if(await user.can('data.write')===false) this.ro=true; }catch(e){}
      const snap=await db.collection('data/users/'+uid).get(); this.docs=new Map(snap.docs.map(d=>[d.id,d.data()]));
      this.ok=true;
      const ac=this.docs.get('accounts'); let ch=false;
      if(ac&&Array.isArray(ac.list)) for(const a of ac.list) if(a&&a.id&&a.name&&a.hash&&a.salt&&!Acc.list.find(x=>x.id===a.id)){ Acc.list.push(a); ch=true; }
      if(ch) store.set('inblox.accounts',Acc.list);
      if(Acc.list.length&&(!ac||!Array.isArray(ac.list)||ac.list.length!==Acc.list.length)) this.accDirty=true;
      if(Acc.cur) this.attach();
      this.set(this.ro?'Облако: только чтение':'Облако: ок'); this.queue();
      if(mode==='auth'){ const n=$('#aName'),w=$('#aPw'); if(Auth.tab==='reg'&&Acc.list.length&&n&&w&&!n.value&&!w.value) Auth.show('login'); }
      else if(mode==='home') Home.render();
    }catch(e){ console.error(e); this.set('Облако: ошибка'); }
  },
  attach(){
    if(!this.ok||!Acc.cur) return;
    const id=Acc.cur.id, was=new Set(store.get('inblox.synced.'+id,[])), cloud=new Map(), pre='g_'+id+'_';
    for(const [k,v] of this.docs) if(k.startsWith(pre)&&v&&v.game&&v.game.id) cloud.set(v.game.id,v);
    S.games=S.games.filter(g=>!(was.has(g.id)&&!cloud.has(g.id)));
    this.sent={};
    for(const [gid,v] of cloud){ const i=S.games.findIndex(x=>x.id===gid); if(i<0) S.games.push(v.game); else if((v.ts||0)>(S.games[i].ts||0)) S.games[i]=v.game; this.sent[gid]=JSON.stringify(v.game); }
    const av=this.docs.get('a_'+id);
    if(av&&av.avatar){ if((av.ts||0)>(S.avatar.ts||0)) S.avatar=Object.assign({},DEF_AVATAR,av.avatar); } else this.avDirty=true;
    store.set(Acc.key('games'),S.games); store.set(Acc.key('avatar'),S.avatar); this.queue();
  },
  queue(){ if(!this.ok||this.ro) return; clearTimeout(this.timer); this.timer=setTimeout(()=>{ this.q=this.q.then(()=>this.flush()); },1500); },
  async flush(){
    if(!this.ok||this.ro||!Acc.cur) return;
    const id=Acc.cur.id, col=this.db.collection('data/users/'+this.uid);
    try{
      if(this.accDirty){ await col.doc('accounts').set({list:Acc.list}); this.accDirty=false; }
      const have=new Set();
      for(const g of S.games){
        have.add(g.id); const js=JSON.stringify(g); if(this.sent[g.id]===js) continue;
        if(js.length>240000){ toast('Игра «'+g.name+'» слишком большая для облака'); continue; }
        await col.doc('g_'+id+'_'+g.id).set({game:g,ts:g.ts||Date.now()}); this.sent[g.id]=js;
      }
      for(const gid of Object.keys(this.sent)) if(!have.has(gid)){ await col.doc('g_'+id+'_'+gid).delete(); delete this.sent[gid]; }
      if(this.avDirty){ await col.doc('a_'+id).set({avatar:S.avatar,ts:S.avatar.ts||Date.now()}); this.avDirty=false; }
      store.set('inblox.synced.'+id,Object.keys(this.sent)); this.set('Облако: ок');
    }catch(e){
      console.error(e);
      if(e&&e.code==='invalid_argument'){ this.ro=true; this.set('Облако: только чтение'); } else this.set('Облако: ошибка');
    }
  }
};

const TYPES={solid:'Блок',kill:'Лава',bounce:'Батут',checkpoint:'Чекпоинт',spawn:'Старт',goal:'Финиш',coin:'Монета',decor:'Декор (без коллизии)',npc:'NPC (персонаж)'};

function tn(c,out,t,f0,f1,dur,type,vol){
  const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.03);
}

const Snd={ctx:null,master:null,mg:null,cache:{},timer:null,src:null,tok:0,
  init(){
    if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.master=this.ctx.createGain(); this.master.gain.value=.8; this.master.connect(this.ctx.destination); this.mg=this.ctx.createGain(); this.mg.gain.value=.5; this.mg.connect(this.master);}catch(e){ this.ctx=null; } }
    if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume();
    if(this.ctx&&!this.jp) this.loadJump();
    return !!this.ctx;
  },
  loadJump(){
    if(this.jp||!this.ctx) return this.jp||Promise.resolve(null);
    try{ const b=atob(JUMP_B64), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
      this.jp=this.ctx.decodeAudioData(u.buffer).then(x=>this.jbuf=x).catch(()=>null); }catch(e){ this.jp=Promise.resolve(null); }
    return this.jp;
  },
  playJump(vol){
    const go=b=>{ if(!b){ SFX.jump(this.ctx,this.master,this.ctx.currentTime,vol); return; } const s=this.ctx.createBufferSource(); s.buffer=b; const g=this.ctx.createGain(); g.gain.value=.8*vol; s.connect(g); g.connect(this.master); s.start(); };
    if(this.jbuf) go(this.jbuf); else this.loadJump().then(go);
  },
  buf(id){
    if(this.cache[id]) return this.cache[id];
    const x=S.sounds.find(v=>v.id===id); if(!x) return Promise.resolve(null);
    return this.cache[id]=(async()=>{
      try{
        const d=await sndData(x);
        if(!d) throw 0;
        const b=atob(d.split(',')[1]), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
        return await this.ctx.decodeAudioData(u.buffer);
      }catch(e){ delete this.cache[id]; return null; }
    })();
  },
  play(ref,vol=1){
    if(!ref||ref==='none'||!this.init()) return;
    if(ref==='b:jump'){ this.playJump(vol); return; }
    if(ref.startsWith('b:')){ const f=SFX[ref.slice(2)]; if(f) f(this.ctx,this.master,this.ctx.currentTime,vol); return; }
    if(ref.startsWith('s:')) this.buf(ref.slice(2)).then(b=>{ if(!b)return; const s=this.ctx.createBufferSource(); s.buffer=b; const g=this.ctx.createGain(); g.gain.value=vol; s.connect(g); g.connect(this.master); s.start(); });
  },
  startMusic(ref){
    this.stopMusic(); if(!ref||ref==='none'||!this.init()) return; const tok=++this.tok, c=this.ctx;
    if(ref.startsWith('s:')){
      this.buf(ref.slice(2)).then(b=>{ if(!b||tok!==this.tok) return; const s=c.createBufferSource(); s.buffer=b; s.loop=true; s.connect(this.mg); s.start(); this.src=s; });
      return;
    }
    const fast=ref==='b:music2', bpm=fast?128:92, st=60/bpm/2, sc=fast?[0,2,4,7,9,12]:[0,3,5,7,10,12], root=fast?196:164.8;
    const pat=[0,2,4,2,5,4,2,1,3,2,4,5,4,2,1,0], f=d=>root*Math.pow(2,d/12); let i=0,t=c.currentTime+.1;
    this.timer=setInterval(()=>{
      while(t<c.currentTime+.3){
        if(i%4===0) tn(c,this.mg,t,f(sc[Math.floor(i/4)%2?3:0])/2,f(sc[Math.floor(i/4)%2?3:0])/2,st*3.5,'triangle',.22);
        if(i%2===0||fast){ const n=f(sc[pat[i%16]%6])*2; tn(c,this.mg,t,n,n,st*.9,fast?'square':'sine',.06); }
        t+=st; i++;
      }
    },60);
  },
  stopMusic(){ this.tok++; if(this.timer){clearInterval(this.timer);this.timer=null;} if(this.src){ try{this.src.stop();}catch(e){} this.src=null; } }
};

   \\\"\\\"\\\"Крупный текст по центру экрана.\\\"\\\"\\\"\\n    _out.append({'c': 'banner', 'text': str(text)[:80], 'sec': _num(sec, 'sec')})\\n\\n\\ndef hud(text=''):\\n    \\\"\\\"\\\"Постоянная строка вверху экрана. Пустая строка убирает её.\\\"\\\"\\\"\\n    _out.append({'c': 'hud', 'text': str(text)[:80]})\\n\\n\\ndef sound(name):\\n    \\\"\\\"\\\"Встроенный звук: jump, coin, win, bounce, checkpoint, click.\\\"\\\"\\\"\\n    _out.append({'c': 'sound', 'name': str(name)})\\n\\n\\ndef win():\\n    _out.append({'c': 'win'})\\n\\n\\ndef die():\\n    _out.append({'c': 'die'})\\n\\n\\ndef elapsed():\\n    \\\"\\\"\\\"Секунды с начала игры.\\\"\\\"\\\"\\n    return _clock[0]\\n\\n\\ndef get(name):\\n    \\\"\\\"\\\"Первый объект с таким именем (или None).\\\"\\\"\\\"\\n    for p in _list:\\n        if p.name == name:\\n            return p\\n    return None\\n\\n\\ndef get_all(name):\\n    return [p for p in _list if p.name == name]\\n\\n\\ndef find(type_):\\n    \\\"\\\"\\\"Все объекты типа: solid, kill, bounce, checkpoint, spawn, goal, coin, decor.\\\"\\\"\\\"\\n    return [p for p in _list if p.type == type_]\\n\\n\\ndef _argc(f):\\n    try:\\n        c = f.__code__\\n        n = c.co_argcount\\n        if getattr(f, '__self__', None) is not None:\\n            n -= 1\\n        return 99 if c.co_flags & 0x04 else n\\n    except Exception:\\n        return 99\\n\\n\\ndef _report(where, e):\\n    line = None\\n    for fr in traceback.extract_tb(e.__traceback__):\\n        if fr.filename == '<script>':\\n            line = fr.lineno\\n    if isinstance(e, SyntaxError):\\n        line = e.lineno\\n        msg = \\\"Синтаксическая ошибка: %s\\\" % (e.msg,)\\n    else:\\n        msg = \\\"%s: %s\\\" % (type(e).__name__, e)\\n    text = \\\"Ошибка\\\" + (\\\" в \\\" + where if where else \\\"\\\") + (\\\" (строка %d)\\\" % line if line else \\\"\\\") + \\\": \\\" + msg\\n    if text in _seen or len(_seen) > 40:\\n        return\\n    _seen.add(text)\\n    _out.append({'c': 'log', 'text': text[:300], 'err': 1})\\n\\n\\nasync def _guard(name, co):\\n    try:\\n        await co\\n    except BaseException as e:\\n        _report(name, e)\\n\\n\\ndef _fire(name, *args):\\n    f = _g.get(name)\\n    if not callable(f):\\n        return\\n    try:\\n        r = f(*args[:_argc(f)])\\n        if asyncio.iscoroutine(r):\\n            asyncio.ensure_future(_guard(name, r))\\n    except BaseException as e:\\n        _report(name, e)\\n\\n\\ndef _safe_import(name, globals=None, locals=None, fromlist=(), level=0):\\n    if name.split('.')[0] in _BLOCK:\\n        raise ImportError(\\\"Модуль «%s» в играх недоступен\\\" % name.split('.')[0])\\n    return _real_import(name, globals, locals, fromlist, level)\\n\\n\\ndef _nope(*a, **k):\\n    raise PermissionError(\\\"Эта функция в играх недоступна\\\")\\n\\n\\ndef _make_globals():\\n    b = dict(vars(builtins))\\n    b['__import__'] = _safe_import\\n    for k in ('open', 'input', 'breakpoint', 'exit', 'quit', 'help'):\\n        b[k] = _nope\\n    return {'__builtins__': b, '__name__': '__main__', 'math': math, 'random': random, 'player': player,\\n            'say': say, 'banner': banner, 'hud': hud, 'sound': sound, 'win': win, 'die': die,\\n            'elapsed': elapsed, 'gui': gui, 'get': get, 'get_all': get_all, 'find': find, 'sleep': asyncio.sleep}\\n\\n\\ndef _flush():\\n    out = []\\n    for i, ks in _dirty.items():\\n        p = _parts[i]\\n        c = {'c': 'set', 'id': i}\\n        for k in ks:\\n            c[k] = p._s[k]\\n        out.append(c)\\n    _dirty.clear()\\n    for i, ks in _gdirty.items():\\n        g = _gids[i]\\n        c = {'c': 'gui', 'id': i}\\n        for k in ks:\\n            c[k] = g._s[k]\\n        out.append(c)\\n    _gdirty.clear()\\n    out.extend(_out)\\n    _out.clear()\\n    return json.dumps(out[:500])\\n\\n\\ndef _init(js):\\n    global _g\\n    m = json.loads(js)\\n    for d in m['parts']:\\n        p = Part(d)\\n        _parts[p._id] = p\\n        _list.append(p)\\n    for d in m.get('gui', []):\\n        g = GuiEl(d)\\n        _gids[g._id] = g\\n        if g.name and g.name not in _guis:\\n            _guis[g.name] = g\\n    player.__dict__.update(name=m.get('name', ''), coins_total=m.get('total', 0))\\n    _g = _make_globals()\\n    try:\\n        exec(compile(m['code'], '<script>', 'exec'), _g)\\n    except BaseException as e:\\n        _report('', e)\\n    else:\\n        _fire('on_start')\\n    return _flush()\\n\\n\\ndef _tick(js):\\n    m = json.loads(js)\\n    p = m['p']\\n    player.__dict__.update(x=p['x'], y=p['y'], z=p['z'], vx=p['vx'], vy=p['vy'], vz=p['vz'],\\n                           grounded=bool(p['g']), coins=p['c'], deaths=p['d'], time=p['t'])\\n    _clock[0] = p['t']\\n    for i, v in (m.get('mv') or {}).items():\\n        q = _parts.get(i)\\n        if q:\\n            s = q._s\\n            s['x'], s['y'], s['z'] = v\\n    for i in m.get('touch', []):\\n        if i in _parts:\\n            _fire('on_touch', _parts[i])\\n    for i in m.get('leave', []):\\n        if i in _parts:\\n            _fire('on_leave', _parts[i])\\n    for _ in range(min(5, m.get('coin', 0))):\\n        _fire('on_coin', player.coins)\\n    for _ in range(min(3, m.get('die', 0))):\\n        _fire('on_die')\\n    for c in m.get('chat', [])[:10]:\\n        _fire('on_chat', c[0], c[1])\\n    for k in m.get('keys', [])[:10]:\\n        _fire('on_key', k)\\n    for n in m.get('gui', [])[:10]:\\n        _fire('on_gui_click', n)\\n    _fire('on_update', m.get('dt', 0.0))\\n    return _flush()\\n\\n\\ndef _check(code):\\n    try:\\n        compile(code, '<script>', 'exec')\\n        return json.dumps({'ok': True})\\n    except SyntaxError as e:\\n        return json.dumps({'ok': False, 'line': e.lineno, 'msg': e.msg})\\n\");\n      tickFn=py.globals.get('_tick'); checkFn=py.globals.get('_check'); initFn=py.globals.get('_init');\n      for(const k of ['fetch','XMLHttpRequest','WebSocket','EventSource','Worker','SharedWorker','im const IMG_MAX=12, IMG_ONE=140000, IMG_TOTAL=600000;
const imgOk=d=>typeof d==='string'&&d.length<=IMG_ONE+2000&&/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(d);
async function imgPack(f){
  if(!f||!(/^image\//.test(f.type)||/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name||''))) throw new Error('type');
  const url=await readDataURL(f); if(!url) throw new Error('read');
  const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('decode')); i.src=url; });
  let k=Math.min(1,512/Math.max(im.width,im.height)), q=.85;
  for(let i=0;i<9;i++){
    const w=Math.max(1,Math.round(im.width*k)), h=Math.max(1,Math.round(im.height*k)), c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    let d=c.toDataURL('image/webp',q); if(!d.startsWith('data:image/webp')) d=c.toDataURL('image/png');
    if(d.length<=IMG_ONE) return d;
    if(d.startsWith('data:image/webp')&&q>.45) q-=.15; else k*=.8;
  }
  throw new Error('big');
}
const imgTexCache=new Map();
function imgTex(id,data){
  const key=id+':'+data.length; let t=imgTexCache.get(key); if(t) return t;
  if(imgTexCache.size>24){ const f=imgTexCache.keys().next().value; const o=imgTexCache.get(f); imgTexCache.delete(f); if(o) o.dispose(); }

}

    const d=$('[data-gdel]',el); if(d) d.onclick=()=>{ this.game.gui=arr.filter(e=>e.id!==this.guiSelId); this.guiSelId=null; this.dirty=true; this.renderBody(); };

  },
  renderProps(el){

    $$('[data-yy]',el).forEach(b=>b.onclick=()=>{ const q=this.part(); if(!q) return; this.pushUndo(); const st=this.snapV||1, k=b.dataset.yy; if(k==='up') q.y+=st; else if(k==='dn') q.y-=st; else q.y=(q.type==='coin'?q.sx:q.sy)/2; this.world.xform(q); this.fillProps(); });

  fillProps(){
    const p=this.part(), el=$('#edBody'); if(!p||this.tab!=='props'||!el) return;
    const set=(k,v)=>{ const i=$(`[data-k="${k}"]`,el); if(i&&i!==document.activeElement) i.value=(typeof v==='number')?+v.toFixed(3):v; };

    const coin=p.type==='coin'; ['sy','sz'].forEach(k=>{ const i=$(`[data-k="${k}"]`,el); if(i) i.disabled=coin; });
  },
  setProp(k,v){
    const p=this.part(); if(!p) return; if(typeof v==='number'&&isNaN(v)) return;
    if(k==='mvaxis') p.mv.axis=v; else if(k==='mvdist') p.mv.dist=Math.max(0,v); else if(k==='mvspeed') p.mv.speed=Math.max(0,v);
    else if(['sx','sy','sz'].includes(k)&&p.type==='npc'){ const q=Math.max(.3,v/(k==='sy'?NPC_H:NPC_W)); p.sx=NPC_W*q; p.sy=NPC_H*q; p.sz=NPC_W*q; }
    else if(['sx','sy','sz'].includes(k)){ p[k]=Math.max(.1,v); if(ROUND.has(p.shape)&&k==='sx') p.sz=p.sx; if(ROUND.has(p.shape)&&k==='sz') p.sx=p.sz; }
    else p[k]=v;
    if(k==='shape'&&ROUND.has(v)) p.sz=p.sx;
    if(k==='type'&&v==='coin'){ p.shape='cyl'; p.sx=p.sy=p.sz=1.2; }
    if(k==='type'&&v==='npc'){ p.npc=p.npc||npcDefault(); p.shape='box'; p.sx=p.sz=NPC_W; p.sy=NPC_H; p.y=Math.max(p.y,NPC_H/2); p.tex=''; delete p.img; }
    this.dirty=true;
    if(['type','shape','color','img','imgFace','tex'].includes(k)){ this.world.update(p); this.fillProps(); } else this.world.xform(p);
    this.fillProps();
    if(k==='type') this.renderBody();
  },

  npcBind(el,p){

  renderScript(el){

async function addSoundFile(f){
  if(f.size>10*1024*1024){ toast('Файл «'+f.name+'» больше 10 МБ'); return; }
  const data=await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(f); });
  if(!data||typeof data!=='string'){ toast('Не удалось прочитать файл'); return; }
  const s={id:uid(),name:f.name.replace(/\.[^.]+$/,'').slice(0,40)||'Звук',data};
  S.sounds.push(s);
  if(Snd.init()){ const b=await Snd.buf(s.id); if(!b){ S.sounds.pop(); delete Snd.cache[s.id]; toast('Не удалось расшифровать «'+f.name+'»: формат не поддерживается'); return; } }
  saveSounds(); toast('Звук добавлен: '+s.name);
}

const HomeBG={scene:null,cam:null,av:null,items:[],t:0,
  init(){
    const s=this.scene=new THREE.Scene(); s.background=new THREE.Color(0x0a0a0c); s.fog=new THREE.Fog(0x0a0a0c,16,44);
    s.add(new THREE.HemisphereLight(0xffffff,0x444455,.85)); const d=new THREE.DirectionalLight(0xffffff,.7); d.position.set(5,9,7); s.add(d);
    const cols=['#59a8ff','#ff5a4d','#ffd23d','#35e0a1','#c77dff','#f4f4f6'];
    for(let i=0;i<18;i++){
      const cyl=i%3===0, m=new THREE.Mesh(cyl?GCYL:GBOX,new THREE.MeshLambertMaterial({color:cols[i%6]})), k=.8+Math.random()*1.7;
      m.scale.set(k,cyl?k*.5:k,k); m.add(new THREE.LineSegments(cyl?ECYL:EBOX,EDGE_MAT));
      m.position.set(-3+Math.random()*14,-1+Math.random()*7,-12+Math.random()*9);
      m.userData={sp:.25+Math.random()*.6,ph:Math.random()*6,y0:m.position.y}; s.add(m); this.items.push(m);
    }
    this.cam=mkCam(45); this.cam.position.set(0,0,14); this.cam.lookAt(0,0,0);
    this.rebuild();
  },
  rebuild(){
    if(!this.scene) return;
    if(this.av){ this.scene.remove(this.av.group); disposeObj(this.av.group); }
    this.av=buildAvatar(S.avatar); this.av.group.position.set(5.6,.4,0); this.av.group.scale.setScalar(1.15); this.scene.add(this.av.group);
  },
  update(dt){
    this.t+=dt;
    for(const m of this.items){ m.rotation.y+=dt*m.userData.sp; m.rotation.x+=dt*m.userData.sp*.5; m.position.y=m.userData.y0+Math.sin(this.t*m.userData.sp+m.userData.ph)*.6; }
    if(this.av){ this.av.group.rotation.y=Math.sin(this.t*.6)*.7; animAvatar(this.av,0,0,false,0); }
  }
};

const Net={
  async list(){ const r=await Api.call('GET','pub'); return r.ok&&Array.isArray(r.d.items)?r.d.items:[]; },
  async get(id){
    const r=await Api.call('GET','pub/'+encodeURIComponent(id)); if(!r.ok) return null; const it=r.d.item;
    if(it&&Array.isArray(it.sounds)) it.sounds=(await Promise.all(it.sounds.map(async s=>{ if(s.data) return s; const q=await Api.call('GET','pub/'+encodeURIComponent(id)+'/sound/'+encodeURIComponent(s.id)); return q.ok&&q.d.data?{id:s.id,name:s.name,data:q.d.data}:null; }))).filter(Boolean);
    return it;
  },
  async publish(game,desc){
    const me=Acc.cur, g=clone(game); delete g.builtin; delete g._snd; const snd=[];
    for(const v of Object.values(g.sounds||{})){ if(typeof v!=='string'||!v.startsWith('s:')) continue; const id=v.slice(2); if(snd.find(q=>q.id===id)) continue;
      const x=S.sounds.find(q=>q.id===id); if(!x) continue;
      if(!x.remote){ const dd=await sndData(x); if(!dd) continue; const sr=await SndSync.send(x.id,x.name,dd); if(!sr.ok) return 'Звук «'+x.name+'» не загрузился на сервер: '+(sr.error||'ошибка сети'); x.remote=true; const ok=SndSync.okGet(); ok.add(x.id); SndSync.okSet(ok); }
      snd.push({id,name:x.name}); }
    const r=await Api.call('POST','pub',{game:g,desc:desc==null?null:desc,sounds:snd}); return r.ok?null:r.error;
  },
  async setName(id,name){ const r=await Api.call('PATCH','pub/'+encodeURIComponent(id),{name}); if(!r.ok) toast(r.error); },
  async setDesc(id,desc){ const r=await Api.call('PATCH','pub/'+encodeURIComponent(id),{desc}); if(!r.ok) toast(r.error); },
  async unpublish(id){ const r=await Api.call('DELETE','pub/'+encodeURIComponent(id)); if(!r.ok) toast(r.error); },
  async like(id){ const r=await Api.call('POST','pub/'+encodeURIComponent(id)+'/like'); return r.ok?r.d:null; },
  async addPlay(id){ Api.call('POST','pub/'+encodeURIComponent(id)+'/play'); },
  async chatList(room){ const r=await Api.call('GET','chat/'+encodeURIComponent(room)); return r.ok?(r.d.messages||[]):[]; },
  async chatSend(room,text){ const r=await Api.call('POST','chat/'+encodeURIComponent(room),{text}); if(!r.ok){ toast(r.error,2500); return null; } return r.d.message; },
  chatSub(room,cb){
    let last=0,stop=false,busy=false;
    const tick=async()=>{ if(stop||busy||document.hidden) return; busy=true; const r=await Api.call('GET','chat/'+encodeURIComponent(room)+'?after='+last); busy=false; if(stop||!r.ok) return; const l=r.d.messages||[]; if(l.length){ last=Math.max(last,...l.map(m=>m.id)); cb(l); } };
    const t=setInterval(tick,2500); return ()=>{ stop=true; clearInterval(t); };
  }
};

  async exportGame(g){
    const used=new Set(Object.values(g.sounds||{}).filter(v=>typeof v==='string'&&v.startsWith('s:')).map(v=>v.slice(2)));
    const us=S.sounds.filter(x=>used.has(x.id)); for(const x of us) await sndData(x);
    const json=JSON.stringify({inblox:1,game:g,sounds:us.map(x=>({id:x.id,name:x.name,data:x.data}))});
    const fn=(g.name.replace(/[^\wЀ-ӿ -]+/g,'').trim()||'game')+'.inblox.json';
    let dl=null; try{ dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null; }catch(e){}
    if(dl){ try{ await dl.save({filename:fn.replace('.inblox.json','')+'.json',data:json}); toast('Файл экспортирован'); return; }catch(e){ if(e&&e.code==='declined') return; } }
    const ov=$('#hOv'); ov.innerHTML=`<div class="box" style="min-width:34em"><h2 style="font-size:1.5em">Экспорт игры</h2><p class="muted">Скопируйте текст и сохраните его в файл .json.</p><textarea class="modal-ta" readonly id="expTa"></textarea><div class="btns"><button class="btn pri" id="expCopy">Копировать</button><button class="btn" id="expClose">Закрыть</button></div></div>`; ov.classList.add('on');
    $('#expTa').value=json; $('#expTa').onfocus=e=>e.target.select(); $('#expClose').onclick=()=>ov.classList.remove('on');
    $('#expCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(json); toast('Скопировано'); }catch(e){ $('#expTa').select(); toast('Выделено: нажмите Ctrl+C'); } };
  },
  async importFile(f){
    if(!f) return;
    try{
      const d=JSON.parse(await f.text()); if(!d||!d.game||!Array.isArray(d.game.parts)) throw 0;
      (d.sounds||[]).forEach(s=>{ if(s&&s.id&&s.data&&!S.sounds.find(x=>x.id===s.id)) S.sounds.push({id:s.id,name:String(s.name||'Звук'),data:s.data}); }); saveSounds();
      const g=d.game; g.id=uid(); delete g.builtin; g.name=String(g.name||'Импорт').slice(0,40); S.games.push(g); saveGames(); this.render(); toast('Игра добавлена: '+g.name);
    }catch(e){ toast('Не удалось открыть файл: это не игра Inblox'); }
  }
};

const Auth={tab:'login',err:'',busy:false,

      <div class="field"><span class="lbl">Имя игрока</span><input type="text" id="aName" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false"></div>

      <p class="muted" style="margin:.4em 0 0;font-size:.85em;text-align:center">Аккаунт, игры и аватар хранятся на сервере: войти можно с любого устройства.</p>
    </div></div>`;
    $('#aTL').onclick=()=>this.show('login'); $('#aTR').onclick=()=>this.show('reg'); $('#aGo').onclick=()=>this.submit();
    $$('input',el).forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter') this.submit(); });
    if(!stage.classList.contains('istouch')) setTimeout(()=>{ const n=$('#aName'); if(n) n.focus(); },50);
  },
  async submit(){
    if(this.busy) return;
    const name=$('#aName').value.trim(), pw=$('#aPw').value, reg=this.tab==='reg', fail=m=>{ this.err=m; $('#aErr').textContent=m; };
    if(name.length<2) return fail('Имя — минимум 2 символа');
    if(pw.length<4) return fail('Пароль — минимум 4 символа');
    if(reg&&pw!==$('#aPw2').value) return fail('Пароли не совпадают');
    this.busy=true; let r;
    try{ r=reg?await Acc.register(name,pw):await Acc.login(name,pw); } catch(e){ r='Не удалось войти: '+(e&&e.message||e); } finally{ this.busy=false; }
    if(r) return fail(r);
    go('home'); Home.render(); toast('Привет, '+Acc.cur.name+'!');
  }
};
let mode='home';
function go(m){
  mode=m; Home.on=(m==='home'); $$('.screen').forEach(s=>s.classList.toggle('on',s.id===m)); ptrs.clear(); pinchD=0;
  canvas.style.visibility=renderer?'visible':'hidden';
}
const inMode=()=>mode==='play'?Play:mode==='editor'?Ed:mode==='avatar'?AvS:null;

/* Координаты внутри сцены (работают и при повороте 16:9 на телефоне) */
function loc(e){
  const r=stage.getBoundingClientRect(); let lx,ly;
  if(Fit.rot){ const cx=r.left+r.width/2, cy=r.top+r.height/2; lx=(e.clientY-cy)+VW/2; ly=-(e.clientX-cx)+VH/2; }
  else{ lx=e.clientX-r.left; ly=e.clientY-r.top; }
  return {lx,ly};
}
const wev=e=>{ const q=loc(e); return {clientX:q.lx,clientY:q.ly,lx:q.lx,ly:q.ly,button:e.button,shiftKey:e.shiftKey,pointerId:e.pointerId}; };

/* Формат 16:9: на телефоне в портрете сцена поворачивается на весь экран */
const Fit={pref:store.get('inblox.fit','on'),rot:false,
  apply(){
    const iw=window.innerWidth, ih=window.innerHeight; this.rot=this.pref==='on'&&ih>iw*1.02;
    if(this.rot){
      const w=Math.min(ih,iw*16/9), h=w*9/16;
      stage.style.cssText='position:fixed;left:50%;top:50%;width:'+w+'px;height:'+h+'px;transform:translate(-50%,-50%) rotate(90deg)';
    } else stage.removeAttribute('style');
    resize();
  },
  async toggle(){
    const portrait=window.innerHeight>window.innerWidth;
    if(portrait&&!document.fullscreenElement){
      this.pref=this.pref==='on'?'off':'on'; store.set('inblox.fit',this.pref); this.apply();
      toast(this.pref==='on'?'Формат 16:9: поверните телефон влево':'Обычный вертикальный режим'); return;
    }
    try{
      if(document.fullscreenElement){ await document.exitFullscreen(); try{ screen.orientation.unlock(); }catch(e){} }
      else{ await document.documentElement.requestFullscreen(); try{ await screen.orientation.lock('landscape'); }catch(e){} }
    }catch(e){ toast('Полный экран здесь недоступен — сцена уже подогнана под 16:9'); }
  }
};
document.addEventListener('click',e=>{ if(e.target.closest&&e.target.closest('.fitb')) Fit.toggle(); });
window.addEventListener('resize',()=>Fit.apply());
window.addEventListener('orientationchange',()=>setTimeout(()=>Fit.apply(),200));
document.addEventListener('fullscreenchange',()=>setTimeout(()=>Fit.apply(),100));
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches) stage.classList.add('istouch');
window.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') stage.classList.add('istouch'); },true);

/* Ввод: мышь, касания, щипок двумя пальцами для зума */
const ptrs=new Map(); let pinchD=0;
const pdist=()=>{ const a=[...ptrs.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); };
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  const m=inMode(); if(!m) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ pinchD=pdist(); if(m.drag!=null&&m.drag!==false) m.pu(e); return; }
  if(ptrs.size>2) return; m.pd(wev(e));
});
canvas.addEventListener('pointermove',e=>{
  const m=inMode(); if(!m) return; if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){ if(ptrs.size===2&&m.wheel){ const d=pdist(); if(pinchD) m.wheel({deltaY:(pinchD-d)*3,preventDefault(){}}); pinchD=d; } return; }
  m.pm(wev(e));
});
const endPtr=e=>{ const m=inMode(); ptrs.delete(e.pointerId); if(ptrs.size<2) pinchD=0; if(m&&ptrs.size===0) m.pu(e); };
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); const m=inMode(); if(m&&m.wheel) m.wheel(e); },{passive:false});
window.addEventListener('keydown',e=>{ if(mode==='play') Play.key(e,true); else if(mode==='editor') Ed.key(e,true); });
window.addEventListener('keyup',e=>{ if(mode==='play') Play.key(e,false); else if(mode==='editor') Ed.key(e,false); });
window.addEventListener('blur',()=>{ Play.keys={}; Ed.keys={}; });
setInterval(()=>{ if(mode==='editor'&&Ed.dirty) Ed.save(true); },5000);

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  try{
    let sc=null,cam=null;
    if(mode==='play'&&Play.world){ Play.update(dt); sc=Play.world; cam=Play.cam; }
    else if(mode==='editor'&&Ed.world){ Ed.update(dt); sc=Ed.world; cam=Ed.cam; }
    else if(mode==='avatar'&&AvS.scene){ AvS.update(dt); sc={scene:AvS.scene}; cam=AvS.cam; }
    else if((mode==='home'||mode==='auth')&&HomeBG.scene){ HomeBG.update(dt); sc={scene:HomeBG.scene}; cam=HomeBG.cam; }
    if(sc&&renderer){ if(sc.stars) sc.stars.position.copy(cam.position); renderer.render(sc.scene,cam); }
  }catch(err){ console.error(err); showErr(err&&err.message||String(err)); }
  requestAnimationFrame(frame);
}
if(renderer){ try{ HomeBG.init(); }catch(err){ console.error(err); } }
Fit.apply();
if(Api.tok){
  go('auth'); $('#auth').innerHTML='<div class="ov on" style="background:rgba(5,5,8,.55)"><div class="box"><p style="margin:0">Подключение к серверу…</p></div></div>';
  Api.call('GET','me').then(r=>{
    if(r.ok&&r.d.user){ Acc.enter(r.d); go('home'); Home.render(); return; }
    if(!r.net&&(r.status===401||r.status===403)){ Api.tok=null; store.set('inblox.token',null); }
    const msg=r.net?'Нет связи с сервером':(r.d.banned?'Аккаунт заблокирован'+(r.d.reason?': '+r.d.reason:'')+banUntil(r.d.until):'');
    Auth.show('login'); if(msg){ Auth.err=msg; const e=$('#aErr'); if(e) e.textContent=msg; }
  });
} else Auth.show('login');
requestAnimationFrame(frame);
Cloud.init();
</script>

</body></html>
